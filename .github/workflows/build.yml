name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Voltliz-Client
          path: build/libs/
      - name: dump minecraft signatures (temporary)
        if: always()
        continue-on-error: true
        run: |
          jar=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-*.jar' | grep -v sources | head -1)
          echo "JAR: $jar"
          javap -cp "$jar" net.minecraft.network.chat.Style | grep -iE 'font' || true
          javap -cp "$jar" net.minecraft.network.chat.FontDescription 'net.minecraft.network.chat.FontDescription$Resource' || true
          javap -cp "$jar" net.minecraft.client.gui.GuiGraphics | grep -E 'blit|drawString|Pipeline|submit|fill\(' || true
          javap -cp "$jar" net.minecraft.client.renderer.texture.DynamicTexture | grep -E 'public' || true
          javap -cp "$jar" com.mojang.blaze3d.platform.NativeImage | grep -E 'NativeImage\(|setPixel|Format' || true
          javap -cp "$jar" net.minecraft.client.renderer.texture.TextureManager | grep -E 'register|public' || true
          javap -cp "$jar" net.minecraft.client.renderer.RenderPipelines | grep -E 'GUI' || true
          javap -cp "$jar" net.minecraft.client.gui.Font | grep -E 'width|lineHeight|drawInBatch' || true
      - name: run client game test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace
      - name: capture test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game-Test-Screenshots
          path: build/run/clientGameTest/screenshots/
      - name: publish screenshots (temporary)
        if: always() && github.event_name == 'push'
        run: |
          cd build/run/clientGameTest/screenshots
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots
