name: release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Loom runs on 25; mods are compiled with the 21 toolchain.
          java-version: |
            21
            25
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build all versions
        run: ./gradlew buildAndCollect --stacktrace
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One jar per Minecraft version, named so the version is obvious from the download list.
          mkdir release
          for dir in build/libs/*/; do
            mc=$(basename "$dir")
            cp "$dir"/*.jar "release/Voltliz-Client-${GITHUB_REF_NAME}-MC-${mc}.jar"
          done
          cat > notes.md <<'EOF'
          ## Descarga
          Baja **solo** el .jar de tu versión de Minecraft (por ejemplo `...-MC-1.21.11.jar` para 1.21.11).

          ## Instalación
          1. Instala [Fabric Loader](https://fabricmc.net/use/installer/) para tu versión de Minecraft.
          2. Pon en la carpeta `.minecraft/mods` el .jar de Voltliz y [Fabric API](https://modrinth.com/mod/fabric-api) para la misma versión.
          3. Abre Minecraft con el perfil de Fabric. El Click GUI se abre con **Shift derecho**.
          EOF
          gh release create "$GITHUB_REF_NAME" release/*.jar --title "Voltliz Client $GITHUB_REF_NAME" --notes-file notes.md
